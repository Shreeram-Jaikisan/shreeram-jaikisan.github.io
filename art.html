<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <title>Art – ShreeramJ</title>

    <link rel="stylesheet" href="style.css">
</head>

<body class="scrolled">

<header class="sidebar">

    <div class="profile">

        <img src="assets/logo.svg" alt="ShreeramJ logo">

        <div class="profile-info">
            <span class="site-name">ShreeramJ</span>

            <span class="site-description">
                writing, research &amp; things I'm making
            </span>
        </div>

    </div>


    <nav class="nav-links">

        <a href="index.html">
            Home
        </a>

        <a href="research.html">
            Research
        </a>

        <a href="art.html" class="active">
            Art
        </a>

        <a href="photos.html">
            Photos
        </a>

        <a href="photos.html#travel">
            Travel
        </a>

    </nav>


    <div class="sidebar-footer">
        &copy; 2026 ShreeramJ
    </div>

</header>


<main>

    <section class="art-page">

        <div class="art-content">

            <h1>Art</h1>

            <div class="art-rule"></div>

            <div class="art-gallery">

                <figure class="art-item">
                    <img
                        src="assets/squid.jpeg"
                        alt="Squidward sketch"
                        loading="lazy"
                    >
                </figure>

                <figure class="art-item">
                    <video
                        autoplay
                        loop
                        muted
                        playsinline
                        aria-label="Patrick animation"
                    >
                        <source src="assets/pat.mp4" type="video/mp4">
                    </video>
                </figure>

                <figure class="art-item art-tall">
                    <img
                        src="assets/Cillian.jpeg"
                        alt="Portrait sketch"
                        loading="lazy"
                    >
                </figure>

                <figure class="art-item art-tall">
                    <img
                        src="assets/Squidward.jpg"
                        alt="Portrait sketch"
                        loading="lazy"
                    >
                </figure>

            </div>

        </div>

    </section>

</main>


<script src="site.js"></script>

</body>

</html>
